    <style>
        * {

            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8ed;
            color: #3b1f12;
            min-height: 100vh;
        }

        .header {
            background: #d94f13;
            color: white;
            padding: 22px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 30px;
        }

        .header span {
            font-size: 15px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 25px;
        }

        .screen-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .screen-title h2 {
            font-size: 28px;
        }

        .back-button {
            border: none;
            background: #3b1f12;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .tables {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .table-button {
            border: none;
            border-radius: 18px;
            padding: 30px 20px;
            background: #f5b82e;
            color: #3b1f12;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.12);
            text-align: center;
            min-height: 145px;
        }

        .table-button:hover {
            transform: translateY(-2px);
        }

        .table-number {
            font-size: 29px;
            font-weight: bold;
        }

        .capacity {
            font-size: 17px;
            margin-top: 8px;
        }

        .status {
            display: inline-block;
            margin-top: 15px;

            border-radius: 20px;
            background: #2f7d32;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #76594a;
            font-size: 14px;
        }
