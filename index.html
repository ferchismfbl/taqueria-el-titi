<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taquería El Titi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f1e8;
    color:#3b1f12;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:none;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.header{
    background:#e85d04;
    color:white;
    padding:18px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:5px 0 0;
    font-size:15px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hidden{
    display:none !important;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    margin-bottom:18px;
}

h2{
    margin-top:0;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    text-align:center;
}

.logo{
    color:#e85d04;
    font-size:32px;
    font-weight:bold;
    margin-bottom:5px;
}

.login-subtitle{
    margin-bottom:25px;
    color:#6b4a3a;
}

.pin-display{
    background:#f5f1e8;
    padding:15px;
    border-radius:12px;
    font-size:28px;
    letter-spacing:8px;
    min-height:58px;
    margin-bottom:18px;
}

.pin-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.pin-grid button{
    background:#e85d04;
    color:white;
    font-size:25px;
    font-weight:bold;
    padding:18px;
    border-radius:12px;
}

.pin-grid button:active{
    transform:scale(.96);
}

.pin-clear{
    background:#3b1f12 !important;
}

.main-buttons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.main-button{
    min-height:130px;
    background:#fcbf49;
    color:#3b1f12;
    border-radius:16px;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,.12);
}

.main-button:active{
    transform:scale(.98);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.btn{
    padding:13px 18px;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;
}

.btn-primary{
    background:#e85d04;
    color:white;
}

.btn-dark{
    background:#3b1f12;
    color:white;
}

.btn-yellow{
    background:#fcbf49;
    color:#3b1f12;
}

.btn-green{
    background:#588157;
    color:white;
}

.btn-red{
    background:#b23a48;
    color:white;
}

.tables{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.table-btn{
    background:#fcbf49;
    border-radius:15px;
    min-height:130px;
    padding:20px;
    font-size:24px;
    font-weight:bold;
    color:#3b1f12;
}

.table-btn small{
    display:block;
    margin-top:8px;
    font-size:15px;
}

.group-button{
    width:100%;
    min-height:110px;
    background:#e85d04;
    color:white;
    border-radius:15px;
    font-size:24px;
    font-weight:bold;
}

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:15px;
}

.category-btn{
    white-space:nowrap;
    background:#3b1f12;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    font-weight:bold;
}

.category-btn.active{
    background:#e85d04;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
}

.product-btn{
    background:white;
    border:3px solid #fcbf49;
    border-radius:13px;
    padding:15px;
    min-height:100px;
    text-align:left;
}

.product-btn:active{
    transform:scale(.98);
}

.product-btn strong{
    display:block;
    font-size:17px;
}

.product-price{
    display:block;
    margin-top:8px;
    color:#e85d04;
    font-weight:bold;
    font-size:18px;
}

.order-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.order-summary{
    position:sticky;
    top:100px;
    height:max-content;
}

.order-item{
    border-bottom:1px solid #ddd;
    padding:12px 0;
}

.order-item:last-child{
    border-bottom:none;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.qty button{
    width:34px;
    height:34px;
    border-radius:8px;
    background:#3b1f12;
    color:white;
    font-size:20px;
}

.total{
    font-size:28px;
    font-weight:bold;
    color:#e85d04;
    text-align:right;
    margin:20px 0;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
}

.option-buttons{
    display:grid;
    gap:10px;
    margin:15px 0;
}

.option-btn{
    padding:15px;
    border-radius:10px;
    background:#fcbf49;
    font-size:17px;
    font-weight:bold;
}

textarea{
    width:100%;
    min-height:90px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-family:inherit;
    resize:vertical;
}

.station-list{
    display:grid;
    gap:15px;
}

.station-order{
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    border-left:7px solid #e85d04;
}

.station-item{
    padding:7px 0;
    border-bottom:1px solid #eee;
}

.station-item:last-child{
    border-bottom:none;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:7px;
    background:#fcbf49;
    font-size:12px;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:40px 20px;
    color:#777;
}

.error-box{
    background:#fff0f0;
    border:2px solid #b23a48;
    border-radius:12px;
    padding:18px;
    color:#7a202d;
    margin-bottom:20px;
}

.loading{
    text-align:center;
    padding:40px;
    font-size:20px;
}

@media(max-width:800px){

    .order-layout{
        grid-template-columns:1fr;
    }

    .order-summary{
        position:static;
    }

    .main-button{
        min-height:110px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const SUPABASE_URL =
"https://svcsphqthbijznomchaa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ks1l7WK_v6mjhs-wrAE2HQ_EK6zAyEL";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   ESTADO
========================================================= */

let currentUser = null;
let currentScreen = "login";

let categories = [];
let products = [];
let tables = [];

let selectedTable = null;
let selectedPeople = null;
let selectedCategory = null;

let currentOrder = [];

let selectedProductForModal = null;


/* =========================================================
   UTILIDADES
========================================================= */

function money(value){

    return "$" +
        Number(value || 0).toFixed(2);
}


function escapeHtml(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function totalOrder(){

    return currentOrder.reduce(
        (sum,item)=>{

            return sum +
                (
                    Number(item.unit_price) *
                    Number(item.quantity)
                );

        },
        0
    );
}


function roleLabel(role){

    return role || "";
}


/* =========================================================
   LOGIN
========================================================= */

let pin = "";


function renderLogin(){

    currentScreen = "login";

    document.getElementById("app").innerHTML = `

        <div class="login">

            <div class="login-box">

                <div class="logo">
                    TAQUERÍA EL TITI
                </div>

                <div class="login-subtitle">
                    Sistema de Comandas
                </div>

                <div class="pin-display">
                    ${pin ? "•".repeat(pin.length) : " "}
                </div>

                <div class="pin-grid">

                    <button onclick="addPin('1')">1</button>
                    <button onclick="addPin('2')">2</button>
                    <button onclick="addPin('3')">3</button>

                    <button onclick="addPin('4')">4</button>
                    <button onclick="addPin('5')">5</button>
                    <button onclick="addPin('6')">6</button>

                    <button onclick="addPin('7')">7</button>
                    <button onclick="addPin('8')">8</button>
                    <button onclick="addPin('9')">9</button>

                    <button
                        class="pin-clear"
                        onclick="clearPin()">
                        BORRAR
                    </button>

                    <button onclick="addPin('0')">
                        0
                    </button>

                    <button onclick="login()">
                        ENTRAR
                    </button>

                </div>

                <div
                    id="loginMessage"
                    style="margin-top:15px;color:#b23a48;">
                </div>

            </div>

        </div>
    `;
}


function addPin(number){

    if(pin.length >= 8){
        return;
    }

    pin += number;

    renderLogin();
}


function clearPin(){

    pin = "";

    renderLogin();
}


async function login(){

    if(!pin){
        return;
    }

    const message =
        document.getElementById("loginMessage");

    try{

        const {
            data,
            error
        } = await supabaseClient.rpc(
            "login_with_pin",
            {
                p_pin:pin
            }
        );

        if(error){

            console.error(error);

            message.textContent =
                error.message ||
                "Error al conectar con el sistema.";

            return;
        }

        if(!data || data.length === 0){

            message.textContent =
                "Código incorrecto.";

            pin = "";

            return;
        }

        currentUser = data[0];

        pin = "";

        renderHome();

    }catch(error){

        console.error(error);

        message.textContent =
            "No se pudo iniciar sesión.";
    }
}


/* =========================================================
   INICIO
========================================================= */

function renderHome(){

    currentScreen = "home";

    let buttons = "";


    if(currentUser.role === "ADMINISTRADOR"){

        buttons += `

            <button
                class="main-button"
                onclick="openAdmin()">

                ADMINISTRADOR

            </button>

            <button
                class="main-button"
                onclick="openMesera()">

                MESAS / COMANDAS

            </button>

            <button
                class="main-button"
                onclick="openCaja()">

                COBRAR

            </button>

            <button
                class="main-button"
                onclick="openStation('COCINA')">

                COCINA / DESAYUNOS

            </button>

            <button
                class="main-button"
                onclick="openStation('PARRILLA')">

                PARRILLA

            </button>
        `;
    }


    if(currentUser.role === "MESERA"){

        buttons += `

            <button
                class="main-button"
                onclick="openMesera()">

                MESAS / COMANDAS

            </button>
        `;
    }


    if(currentUser.role === "CAJA"){

        buttons += `

            <button
                class="main-button"
                onclick="openCaja()">

                COBRAR

            </button>
        `;
    }


    if(currentUser.role === "COCINA"){

        buttons += `

            <button
                class="main-button"
                onclick="openStation('COCINA')">

                COCINA / DESAYUNOS

            </button>
        `;
    }


    if(currentUser.role === "PARRILLA"){

        buttons += `

            <button
                class="main-button"
                onclick="openStation('PARRILLA')">

                PARRILLA

            </button>
        `;
    }


    document.getElementById("app").innerHTML = `

        <div class="header">

            <h1>
                TAQUERÍA EL TITI
            </h1>

            <p>
                ${escapeHtml(currentUser.full_name)}
                ·
                ${roleLabel(currentUser.role)}
            </p>

        </div>

        <div class="container">

            <div class="topbar">

                <h2>
                    Menú principal
                </h2>

                <button
                    class="btn btn-dark"
                    onclick="logout()">

                    CERRAR SESIÓN

                </button>

            </div>

            <div class="main-buttons">

                ${buttons}

            </div>

        </div>
    `;
}


function logout(){

    currentUser = null;

    pin = "";

    currentOrder = [];

    selectedTable = null;

    selectedPeople = null;

    selectedCategory = null;

    renderLogin();
}


/* =========================================================
   MESERA
========================================================= */

async function openMesera(){

    document.getElementById("app").innerHTML = `

        <div class="header">

            <h1>
                TAQUERÍA EL TITI
            </h1>

            <p>
                MESAS / COMANDAS
            </p>

        </div>

        <div class="container">

            <div class="loading">
                Cargando mesas y menú...
            </div>

        </div>
    `;


    const success =
        await loadBaseData();


    if(!success){
        return;
    }


    selectedCategory =
        categories.length
        ? categories[0].id
        : null;


    renderTables();
}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadBaseData(){

    const [
        categoriesResponse,
        productsResponse,
        tablesResponse
    ] = await Promise.all([

        supabaseClient
            .from("categories")
            .select("*")
            .eq("active",true)
            .order("sort_order"),

        supabaseClient
            .from("products")
            .select("*")
            .eq("active",true)
            .order("sort_order"),

        supabaseClient
            .from("tables_restaurant")
            .select("*")
            .eq("active",true)
            .order("id")
    ]);


    if(categoriesResponse.error){

        console.error(
            "Error categorías:",
            categoriesResponse.error
        );
    }


    if(productsResponse.error){

        console.error(
            "Error productos:",
            productsResponse.error
        );
    }


    if(tablesResponse.error){

        console.error(
            "Error mesas:",
            tablesResponse.error
        );

        renderDataError(
            "No se pudieron cargar las mesas.",
            tablesResponse.error.message
        );

        return false;
    }


    categories =
        categoriesResponse.data || [];


    products =
        productsResponse.data || [];


    /*
       IMPORTANTE:

       Tu tabla real utiliza:

       id
       name
       capacity
       active

       Por eso convertimos esos datos al formato
       que utiliza el resto de la aplicación.
    */

    tables =
        (tablesResponse.data || []).map(table=>{

            const tableId =
                Number(table.id);

            const capacity =
                Number(table.capacity || 0);


            return {

                ...table,

                id:tableId,

                displayName:
                    table.name ||
                    "MESA " + tableId,

                min_capacity:
                    tableId >= 6
                    ? 2
                    : 1,

                max_capacity:
                    capacity ||
                    (
                        tableId >= 6
                        ? 4
                        : 6
                    )
            };
        });


    /*
       Si Supabase no devuelve mesas, mostramos
       las 8 mesas configuradas para El Titi.

       Esto permite que la pantalla de la mesera
       siga funcionando mientras terminamos
       de ajustar la base de datos.
    */

    if(tables.length === 0){

        tables = [

            {
                id:1,
                displayName:"MESA 1",
                min_capacity:1,
                max_capacity:6
            },

            {
                id:2,
                displayName:"MESA 2",
                min_capacity:1,
                max_capacity:6
            },

            {
                id:3,
                displayName:"MESA 3",
                min_capacity:1,
                max_capacity:6
            },

            {
                id:4,
                displayName:"MESA 4",
                min_capacity:1,
                max_capacity:6
            },

            {
                id:5,
                displayName:"MESA 5",
                min_capacity:1,
                max_capacity:6
            },

            {
                id:6,
                displayName:"MESA 6",
                min_capacity:2,
                max_capacity:4
            },

            {
                id:7,
                displayName:"MESA 7",
                min_capacity:2,
                max_capacity:4
            },

            {
                id:8,
                displayName:"MESA 8",
                min_capacity:2,
                max_capacity:4
            }
        ];
    }


    return true;
}


function renderDataError(title,message){

    document.getElementById("app").innerHTML = `

        <div class="header">

            <h1>
                TAQUERÍA EL TITI
            </h1>

        </div>

        <div class="container">

            <div class="error-box">

                <h2>
                    ${escapeHtml(title)}
                </h2>

                <p>
                    ${escapeHtml(message)}
                </p>

            </div>

            <button
                class="btn btn-dark"
                onclick="renderHome()">

                REGRESAR

            </button>

        </div>
    `;
}


/* =========================================================
   MESAS
========================================================= */

function renderTables(){

    currentScreen = "tables";


    let html = `

        <div class="header">

            <h1>
                TAQUERÍA EL TITI
            </h1>

            <p>
                MESAS / COMANDAS
            </p>

        </div>

        <div class="container">

            <div class="topbar">

                <h2>
                    Selecciona una mesa
                </h2>

                <button
                    class="btn btn-dark"
                    onclick="renderHome()">

                    REGRESAR

                </button>

            </div>

            <div class="tables">
    `;


    tables.forEach(table=>{

        html += `

            <button
                class="table-btn"
                onclick="selectTable(${table.id})">

                ${escapeHtml(
                    table.displayName ||
                    "MESA " + table.id
                )}

                <small>
                    ${table.min_capacity}
                    -
                    ${table.max_capacity}
                    personas
                </small>

            </button>
        `;
    });


    html += `

            </div>

            <div style="margin-top:20px">

                <button
                    class="group-button"
                    onclick="openGroupOrder()">

                    GRUPO / CAMIÓN

                </button>

            </div>

        </div>
    `;


    document.getElementById("app").innerHTML =
        html;
}


/* =========================================================
   SELECCIONAR MESA
========================================================= */

function selectTable(tableId){

    selectedTable =
        tables.find(
            t=>Number(t.id) === Number(tableId)
        );


    if(!selectedTable){
        return;
    }


    let buttons = "";


    for(
        let i = selectedTable.min_capacity;
        i <= selectedTable.max_capacity;
        i++
    ){

        buttons += `

            <button
                class="main-button"
                style="min-height:80px"
                onclick="selectPeople(${i})">

                ${i}
                ${i === 1
                    ? "PERSONA"
                    : "PERSONAS"}

            </button>
        `;
    }


    document.getElementById("app").innerHTML = `

        <div class="header">

            <h1>
                ${escapeHtml(
                    selectedTable.displayName ||
                    "MESA " + selectedTable.id
                )}
            </h1>

            <p>
                ¿Cuántas personas hay?
            </p>

        </div>

        <div class="container">

            <div class="main-buttons">

                ${buttons}

            </div>

            <br>

            <button
                class="btn btn-dark"
                onclick="renderTables()">

                REGRESAR

            </button>

        </div>
    `;
}


function selectPeople(number){

    selectedPeople = number;

    currentOrder = [];

    selectedCategory =
        categories.length
        ? categories[0].id
        : null;

    renderComanda();
}


/* =========================================================
   COMANDA
========================================================= */

function renderComanda(){

    currentScreen = "comanda";


    if(
        !selectedCategory &&
        categories.length
    ){

        selectedCategory =
            categories[0].id;
    }


    const category =
        categories.find(
            c=>c.id === selectedCategory
        );


    const categoryProducts =
        products.filter(
            p=>p.category_id === selectedCategory
        );


    let categoryHtml = "";


    categories.forEach(c=>{

        categoryHtml += `

            <button
                class="category-btn
                ${c.id === selectedCategory
                    ? "active"
                    : ""}"
                onclick="selectCategory('${c.id}')">

                ${escapeHtml(c.name)}

            </button>
        `;
    });


    let productsHtml = "";


    categoryProducts.forEach(product=>{

        productsHtml += `

            <button
                class="product-btn"
                onclick="addProduct('${product.id}')">

                <strong>
                    ${escapeHtml(product.name)}
                </strong>

                <span class="product-price">
                    ${money(product.price)}
                </span>

            </button>
        `;
    });


    let orderHtml = "";


    if(currentOrder.length === 0){

        orderHtml = `

            <div class="empty">

                Todavía no hay productos.

            </div>
        `;

    }else{

        currentOrder.forEach(
            (item,index)=>{

                orderHtml += `

                    <div class="order-item">

                        <strong>
                            ${escapeHtml(
                                item.product_name
                            )}
                        </strong>

                        ${
                            item.option_text
                            ?
                            `<div>
                                ${escapeHtml(
                                    item.option_text
                                )}
                             </div>`
                            :
                            ""
                        }

                        ${
                            item.note
                            ?
                            `<div
                                style="
                                font-size:13px;
                                color:#777">
                                Nota:
                                ${escapeHtml(
                                    item.note
                                )}
                             </div>`
                            :
                            ""
                        }

                        <div class="qty">

                            <button
                                onclick="
                                changeQty(
                                    ${index},

========================================================= */

async function addProduct(productId){

    const product =
        products.find(
            p=>p.id === productId
        );


    if(!product){
        return;
    }


    if(product.name === "Huevos al Gusto"){

        selectedProductForModal =
            product;

        showHuevosModal();

        return;
    }


    addItemToOrder(
        product,
        "",
        ""
    );
}


function addItemToOrder(
    product,
    optionText,
    note
){

    const existing =
        currentOrder.find(
            item=>
                item.product_id === product.id &&
                item.option_text === optionText &&
                item.note === note
        );


    if(existing){

        existing.quantity++;

    }else{

        currentOrder.push({

            product_id:
                product.id,

            product_name:
                product.name,

            quantity:1,

            unit_price:
                Number(product.price),

            option_text:
                optionText,

            note:
                note,

            station:
                product.station ||
                "COCINA"
        });
    }


    renderComanda();
}


function changeQty(
    index,
    change
){

    if(!currentOrder[index]){
        return;
    }


    currentOrder[index].quantity +=
        change;


    if(
        currentOrder[index].quantity <= 0
    ){

        currentOrder.splice(
            index,
            1
        );
    }


    renderComanda();
}

/* =========================================================
   ENVIAR COMANDA
========================================================= */

async function sendOrder(){

    if(currentOrder.length === 0){

        alert(
            "La comanda está vacía."
        );

        return;
    }


    try{

        const total =
            totalOrder();


        const orderType =
            selectedTable
            ? "MESA"
            : "GRUPO";


        const {
            data:order,
            error:orderError
        } =
            await supabaseClient
            .from("orders")
            .insert({

                order_type:
                    orderType,

                table_id:
                    selectedTable
                    ? selectedTable.id
                    : null,

                people:
                    selectedPeople ||
                    null,

                status:
                    "NUEVA",

                total:
                    total,

                created_by:
                    null

            })
            .select()
            .single();


        if(orderError){

            console.error(
                orderError
            );

            alert(
                "No se pudo guardar la comanda:\n" +
                orderError.message
            );

            return;
        }


        const items =
            currentOrder.map(
                item=>({

                    order_id:
                        order.id,

                    product_id:
                        item.product_id,

                    product_name:
                        item.product_name,

                    quantity:
                        item.quantity,

                    unit_price:
                        item.unit_price,

                    option_text:
                        item.option_text,

                    note:
                        item.note,

                    station:
                        item.station

                })
            );


        const {
            error:itemError
        } =
            await supabaseClient
            .from("order_items")
            .insert(items);


        if(itemError){

            console.error(
                itemError
            );

            alert(
                "La orden se creó, pero hubo un problema con los productos:\n" +
                itemError.message
            );

            return;
        }


        const stations =
            [
                ...new Set(
                    currentOrder.map(
                        item=>
                            item.station ||
                            "COCINA"
                    )
                )
            ];


        const printJobs =
            stations.map(
                station=>({

                    order_id:
                        order.id,

                    station:
                        station,

                    printed:
                        false

                })
            );


        if(printJobs.length){

            const {
                error:printError
            } =
                await supabaseClient
                .from("print_jobs")
                .insert(
                    printJobs
                );


            if(printError){

                console.error(
                    printError
                );
            }
        }


        alert(
            "COMANDA ENVIADA CORRECTAMENTE"
        );


        currentOrder = [];

        selectedTable = null;

        selectedPeople = null;

        renderTables();


    }catch(error){

        console.error(
            error
        );

        alert(
            "Ocurrió un error al enviar la comanda."
        );
    }
}

async function payOrder(
    orderId,
    method
){

    if(
        !confirm(
            "¿Confirmar pago por " +
            method +
            "?"
        )
    ){

        return;
    }


    const {
        data:order,
        error:orderError
    } =
        await supabaseClient
        .from("orders")
        .select("*")
        .eq("id",orderId)
        .single();


    if(orderError){

        alert(
            orderError.message
        );

        return;
    }


    const {
        error:paymentError
    } =
        await supabaseClient
        .from("payments")
        .insert({

            order_id:
                order.id,

            table_id:
                order.table_id,

            amount:
                order.total,

            method:
                method,

            received:
                order.total,

            change_amount:
                0,

            created_by:
                null

        });


    if(paymentError){

        alert(
            "No se pudo registrar el pago:\n" +
            paymentError.message
        );

        return;
    }


    const {
        error:updateError
    } =
        await supabaseClient
        .from("orders")
        .update({

            status:
                "PAGADA",

            paid_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            orderId
        );


    if(updateError){

        alert(
            updateError.message
        );

        return;
    }


    openCaja();
}

                price,

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            productId
        );


    if(error){

        alert(
            "No se pudo guardar:\n" +
            error.message
        );

        return;
    }


    closeModal();

    adminProducts();
}


/* =========================================================
   USUARIOS
========================================================= */

async function adminUsers(){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("app_users")
        .select(
            "id,full_name,role,active"
        )
        .order(
            "full_name"
        );


    if(error){

        alert(
            error.message
        );

        return;
    }


    let html = "";


    (data || []).forEach(
        user=>{

            html += `

                <div class="card">

                    <strong>
                        ${escapeHtml(
                            user.full_name
                        )}
                    </strong>

                    <div>
                        ${escapeHtml(
                            user.role
                        )}
                    </div>

                    <div>
                        Estado:
                        ${
                            user.active
                            ?
                            "ACTIVO"
                            :
                            "INACTIVO"
                        }
                    </div>

                </div>
            `;
        }
    );


    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="header">

            <h1>
                TAQUERÍA EL TITI
            </h1>

            <p>
                USUARIOS
            </p>

        </div>

        <div class="container">

            <div class="topbar">

                <h2>
                    Usuarios del sistema
                </h2>

                <button
                    class="btn btn-dark"
                    onclick="openAdmin()">

                    REGRESAR

                </button>

            </div>

            ${
                html ||
                `
                <div class="empty">
                    No hay usuarios.
                </div>
                `
            }

        </div>
    `;
}


/* =========================================================
   INICIAR
========================================================= */

renderLogin();

</script>
