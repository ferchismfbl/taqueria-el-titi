<style>

/* =========================

<div id="loginScreen">

            <button class="key" onclick="addPin('7')">7</button>
            <button class="key" onclick="addPin('8')">8</button>
            <button class="key" onclick="addPin('9')">9</button>

            <button class="key" onclick="deletePin()">←</button>

    <div id="modalContent" class="modal"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://svcsphqthbijznomchaa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Ks1l7WK_v6mjhs-wrAE2HQ_EK6zAyEL";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ESTADO
========================================================= */

let pin = "";

let currentUser = null;

let categories = [];
let products = [];
let tables = [];

let selectedTable = null;
let selectedCategory = null;

let currentOrderItems = [];

let currentView = "home";


/* =========================================================
   LOGIN
========================================================= */

function updatePinDisplay() {

    const display =
        document.getElementById("pinDisplay");

    display.textContent =
        pin.length > 0
            ? "•".repeat(pin.length)
            : "";
}


function addPin(number) {

    if (pin.length >= 8) return;

    pin += number;

    updatePinDisplay();
}


function clearPin() {

    pin = "";

    updatePinDisplay();

    document.getElementById("loginError").textContent = "";
}


function deletePin() {

    pin = pin.slice(0, -1);

    updatePinDisplay();
}


async function login() {

    const errorBox =
        document.getElementById("loginError");

    errorBox.textContent = "";

    if (!pin) {

        errorBox.textContent =
            "Escribe tu PIN.";

        return;
    }

    try {

        const { data, error } =
            await supabaseClient.rpc(
                "login_with_pin",
                {
                    p_pin: pin
                }
            );

        if (error) {

            console.error(error);

            errorBox.textContent =
                "Error al iniciar sesión.";

            return;
        }

        if (!data || data.length === 0) {

            errorBox.textContent =
                "PIN incorrecto.";

            pin = "";

            updatePinDisplay();

            return;
        }

        currentUser = data[0];

        pin = "";

        updatePinDisplay();

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("appScreen")
            .classList.remove("hidden");

        document.getElementById("userName").textContent =
            currentUser.full_name +
            " · " +
            currentUser.role;

        renderHome();

    } catch (error) {

        console.error(error);

        errorBox.textContent =
            "No se pudo iniciar sesión.";
    }
}


function logout() {

    currentUser = null;

    selectedTable = null;
    currentOrderItems = [];

    document
        .getElementById("appScreen")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    clearPin();
}


/* =========================================================
   HOME
========================================================= */

function renderHome() {

    currentView = "home";

    let html = `
        <div class="screen">

            <div class="page-title">
                Bienvenido
            </div>

            <div class="page-subtitle">
                Selecciona una sección.
            </div>

            <div class="home-grid">
    `;

    const role = currentUser.role;


    if (
        role === "ADMINISTRADOR" ||
        role === "MESERA"
    ) {

        html += `
            <button
                class="home-card primary"
                onclick="openMesera()">

                <div class="home-card-title">
                    MESAS / COMANDAS
                </div>

                <div class="home-card-text">
                    Tomar pedidos de mesas y grupos.
                </div>

            </button>
        `;
    }


    if (
        role === "ADMINISTRADOR" ||
        role === "CAJA"
    ) {

        html += `
            <button
                class="home-card yellow"
                onclick="openCaja()">

                <div class="home-card-title">
                    COBRAR
                </div>

                <div class="home-card-text">
                    Cobrar cuentas de mesas y grupos.
                </div>

            </button>
        `;
    }


    if (
        role === "ADMINISTRADOR" ||
        role === "COCINA"
    ) {

        html += `
            <button
                class="home-card green"
                onclick="openStation('COCINA')">

                <div class="home-card-title">
                    COCINA
                </div>

                <div class="home-card-text">
                    Ver comandas de desayunos.
                </div>

            </button>
        `;
    }


    if (
        role === "ADMINISTRADOR" ||
        role === "PARRILLA"
    ) {

        html += `
            <button
                class="home-card dark"
                onclick="openStation('PARRILLA')">

                <div class="home-card-title">
                    PARRILLA
                </div>

                <div class="home-card-text">
                    Ver comandas de tacos.
                </div>

            </button>
        `;
    }


    if (role === "ADMINISTRADOR") {

        html += `
            <button
                class="home-card primary"
                onclick="openAdmin()">

                <div class="home-card-title">
                    ADMINISTRACIÓN
                </div>

                <div class="home-card-text">
                    Menú, precios y usuarios.
                </div>

            </button>
        `;
    }


    html += `
            </div>
        </div>
    `;

    document.getElementById("mainContent").innerHTML =
        html;
}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadBaseData() {

    console.log("Cargando datos...");

    categories = [];
    products = [];
    tables = [];


    /* -------------------------
       CATEGORÍAS
    ------------------------- */

    const categoryResult =
        await supabaseClient
            .from("categories")
            .select("*")
            .order("sort_order", {
                ascending: true
            });


    if (categoryResult.error) {

        console.error(
            "ERROR CATEGORÍAS:",
            categoryResult.error
        );

    } else {

        categories =
            categoryResult.data || [];

        /*
         Si existe active, solamente mostramos
         las activas.
        */
        categories =
            categories.filter(category => {

                if (
                    Object.prototype.hasOwnProperty.call(
                        category,
                        "active"
                    )
                ) {

                    return category.active === true;
                }

                return true;
            });
    }


    /* -------------------------
       PRODUCTOS
    ------------------------- */

    const productResult =
        await supabaseClient
            .from("products")
            .select("*")
            .order("sort_order", {
                ascending: true
            });


    if (productResult.error) {

        console.error(
            "ERROR PRODUCTOS:",
            productResult.error
        );

    } else {

        products =
            productResult.data || [];

        products =
            products.filter(product => {

                if (
                    Object.prototype.hasOwnProperty.call(
                        product,
                        "active"
                    )
                ) {

                    return product.active === true;
                }

                return true;
            });
    }


    /* -------------------------
       MESAS
    ------------------------- */

    const tableResult =
        await supabaseClient
            .from("tables_restaurant")
            .select("*")
            .order("id", {
                ascending: true
            });


    if (tableResult.error) {

        console.error(
            "ERROR MESAS:",
            tableResult.error
        );

        tables = createFallbackTables();

    } else {

        let dbTables =
            tableResult.data || [];

        dbTables =
            dbTables.filter(table => {

                if (
                    Object.prototype.hasOwnProperty.call(
                        table,
                        "active"
                    )
                ) {

                    return table.active === true;
                }

                return true;
            });

        if (dbTables.length > 0) {

            tables =
                dbTables.map(normalizeTable);

        } else {

            tables =
                createFallbackTables();
        }
    }


    console.log(
        "CATEGORÍAS CARGADAS:",
        categories
    );

    console.log(
        "PRODUCTOS CARGADOS:",
        products
    );

    console.log(
        "MESAS CARGADAS:",
        tables
    );
}


/* =========================================================
   MESAS
========================================================= */

function createFallbackTables() {

    const result = [];

    for (let i = 1; i <= 8; i++) {

        result.push({

            id: i,

            name: "Mesa " + i,

            min_capacity:
                i <= 5 ? 1 : 2,

            max_capacity:
                i <= 5 ? 6 : 4,

            active: true
        });
    }

    return result;
}


function normalizeTable(table) {

    const id =
        Number(table.id);


    let minCapacity =
        table.min_capacity ??
        table.min_people ??
        table.min_persons ??
        table.minimum_capacity ??
        null;


    let maxCapacity =
        table.max_capacity ??
        table.capacity ??
        table.max_people ??
        table.max_persons ??
        table.maximum_capacity ??
        null;


    if (!minCapacity) {

        minCapacity =
            id <= 5 ? 1 : 2;
    }


    if (!maxCapacity) {

        maxCapacity =
            id <= 5 ? 6 : 4;
    }


    return {

        ...table,

        id,

        name:
            table.name ||
            table.table_name ||
            "Mesa " + id,

        min_capacity:
            Number(minCapacity),

        max_capacity:
            Number(maxCapacity)
    };
}


/* =========================================================
   MESERA
========================================================= */

async function openMesera() {

    currentView = "tables";

    selectedTable = null;

    currentOrderItems = [];

    document.getElementById("mainContent").innerHTML = `
        <div class="screen">

            <div class="page-title">
                Cargando mesas...
            </div>

        </div>
    `;

    await loadBaseData();

    renderTables();
}


function renderTables() {

    let html = `
        <div class="screen">

            <div class="page-title">
                MESAS / COMANDAS
            </div>

            <div class="page-subtitle">
                Selecciona una mesa o un grupo/camión.
            </div>

            <div class="tables-grid">
    `;


    tables.forEach(table => {

        html += `
            <button
                class="table-card"
                onclick="selectTable(${table.id})">

                <div class="table-number">
                    MESA ${table.id}
                </div>

                <div class="table-capacity">
                    ${table.min_capacity}
                    -
                    ${table.max_capacity}
                    personas
                </div>

            </button>
        `;
    });


    html += `

async function selectTable(tableId) {

        tables.find(
            table =>
                Number(table.id) ===
                Number(tableId)
        );


    if (!selectedTable) {

        alert(
            "No se encontró la mesa seleccionada."
        );

        return;
    }


    currentOrderItems = [];


    /*
      Si por alguna razón el menú todavía
      no está cargado, lo cargamos aquí.
    */

    if (
        categories.length === 0 ||
        products.length === 0
    ) {

        await loadBaseData();
    }


    selectedCategory =
        categories.length > 0
            ? categories[0].id
            : null;


    renderComanda();
}

/* =========================================================

========================================================= */

function renderComanda() {

    let html = `
        <div class="screen">

            <div class="page-title">
                ${escapeHtml(
                    selectedTable.name
                )}
            </div>

            ${
                selectedTable.id
                    ? `
                        <div class="page-subtitle">
                            Mesa ${selectedTable.id}
                            ·
                            ${selectedTable.max_capacity}
                            personas
                        </div>
                    `
                    : `
                        <div class="page-subtitle">
                            Cobro inmediato
                        </div>
                    `
            }

            <div class="cancel-row">
                <button
                    class="btn btn-secondary"
                    onclick="renderTables()">

                    CANCELAR

                </button>
            </div>

            <div class="comanda-layout">

                <div class="menu-area">

                    <div class="category-list">
    `;


    /* -------------------------
       CATEGORÍAS
    ------------------------- */

    if (categories.length === 0) {

        html += `
            <div class="empty-message"
                 style="width:100%;">

                No se encontraron categorías
                del menú.

            </div>
        `;

    } else {

        categories.forEach(category => {

            const active =
                String(category.id) ===
                String(selectedCategory);


            html += `
                <button
                    class="category-button ${active ? "active" : ""}"
                    onclick="selectCategory('${escapeAttribute(category.id)}')">

                    ${escapeHtml(
                        category.name
                    )}

                </button>
            `;
        });
    }


    html += `
                    </div>

                    <div id="productsContainer">
    `;


    renderProductsIntoHtml = true;


    const categoryProducts =
        products.filter(product => {

            return String(product.category_id) ===
                   String(selectedCategory);
        });


    if (
        categories.length > 0 &&
        categoryProducts.length === 0
    ) {

        html += `
            <div class="empty-message">

                No hay productos en esta categoría.

            </div>
        `;

    } else {

        html += `
            <div class="products-grid">
        `;


        categoryProducts.forEach(product => {

            html += `
                <button
                    class="product-card"
                    onclick="addProduct('${escapeAttribute(product.id)}')">

                    <div class="product-name">
                        ${escapeHtml(
                            product.name
                        )}
                    </div>

                    <div class="product-price">
                        $${formatMoney(product.price)}
                    </div>

                </button>
            `;
        });


        html += `
            </div>
        `;
    }


    html += `
                    </div>

                </div>

                <div class="order-area">

                    <div class="order-title">
                        COMANDA
                    </div>

                    <div class="order-subtitle">
                        ${escapeHtml(
                            selectedTable.name
                        )}
                    </div>

                    <div id="orderItemsContainer">
    `;


    if (currentOrderItems.length === 0) {

        html += `
            <div class="empty-message">

                Agrega productos al pedido.

            </div>
        `;

    } else {

        currentOrderItems.forEach((item, index) => {

            html += `
                <div class="order-item">

                    <div class="order-item-name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="order-item-line">

                        <div class="quantity-controls">

                            <button
                                class="qty-button"
                                onclick="changeQuantity(${index}, -1)">
                                -
                            </button>

                            <strong>
                                ${item.quantity}
                            </strong>

                            <button
                                class="qty-button"
                                onclick="changeQuantity(${index}, 1)">
                                +
                            </button>

                        </div>

                        <strong>
                            $${formatMoney(
                                Number(item.price) *
                                Number(item.quantity)
                            )}
                        </strong>

                    </div>

                </div>
            `;
        });
    }


    const total =
        currentOrderItems.reduce(
            (sum, item) =>
                sum +
                Number(item.price) *
                Number(item.quantity),
            0
        );


    html += `
                    </div>

                    <div class="order-total">

                        <span>
                            TOTAL
                        </span>

                        <span>
                            $${formatMoney(total)}
                        </span>

                    </div>

                    ${
                        currentOrderItems.length > 0
                            ? `
                                <button
                                    class="send-button"
                                    onclick="sendOrder()">

                                    ENVIAR COMANDA

                                </button>
                              `
                            : ""
                    }

                </div>

            </div>

        </div>
    `;


    document.getElementById("mainContent").innerHTML =
        html;
}


let renderProductsIntoHtml = false;


/* =========================================================
   CATEGORÍAS
========================================================= */

function selectCategory(categoryId) {

    selectedCategory =

/* =========================================================
   PRODUCTOS
========================================================= */

function addProduct(productId) {

    const product =
        products.find(
            p =>
                String(p.id) ===
                String(productId)
        );


    if (!product) {

        alert(
            "No se encontró el producto."
        );

        return;
    }


    /*
      Huevos al gusto necesita elegir
      preparación.
    */

    if (
        String(product.name)
            .toLowerCase()
            .includes("huevos al gusto")
    ) {

        openHuevosModal(product);

        return;
    }


    addProductToOrder(product);
}


function addProductToOrder(
    product,
    extraName = null
) {

    const finalName =
        extraName
            ? product.name +
              " (" +
              extraName +
              ")"
            : product.name;


    const existing =
        currentOrderItems.find(
            item =>
                item.product_id === product.id &&
                item.name === finalName
        );


    if (existing) {

        existing.quantity++;

    } else {

        currentOrderItems.push({

            product_id:
                product.id,

            name:
                finalName,

            price:
                Number(product.price),

            quantity:
                1,

            station:
                product.station ||
                getStationForProduct(product)
        });
    }


    renderComanda();
}


function getStationForProduct(product) {

    const category =
        categories.find(
            c =>
                String(c.id) ===
                String(product.category_id)
        );


    const categoryName =
        category
            ? String(category.name).toUpperCase()
            : "";


    const productName =
        String(product.name)
            .toUpperCase();


    /*
      Desayunos -> COCINA
      Tacos -> PARRILLA
    */

    if (
        categoryName.includes("TACO") ||
        productName.includes("TACO")
    ) {

        return "PARRILLA";
    }


    return "COCINA";
}

/* =========================================================
   CANTIDADES
========================================================= */

function changeQuantity(
    index,
    change
) {

    const item =
        currentOrderItems[index];


    if (!item) return;


    item.quantity += change;


    if (item.quantity <= 0) {

        currentOrderItems.splice(
            index,
            1
        );
    }


    renderComanda();
}


/* =========================================================
   ENVIAR PEDIDO
========================================================= */

async function sendOrder() {

    if (
        !selectedTable ||
        currentOrderItems.length === 0
    ) {

        alert(
            "Agrega productos antes de enviar."
        );

        return;
    }


    const total =
        currentOrderItems.reduce(
            (sum, item) =>
                sum +
                Number(item.price) *
                Number(item.quantity),
            0
        );


    const orderData = {

        table_id:
            selectedTable.id || null,

        order_type:
            selectedTable.id
                ? "MESA"
                : "GRUPO",

        status:
            selectedTable.id
                ? "NUEVA"
                : "PENDIENTE_PAGO",

        total:
            total,

        created_by:
            null
    };


    try {

        const {
            data: order,
            error: orderError
        } =
            await supabaseClient
                .from("orders")
                .insert(orderData)
                .select()
                .single();


        if (orderError) {

            console.error(
                "ERROR CREANDO ORDEN:",
                orderError
            );

            alert(
                "No se pudo crear la comanda:\n" +
                orderError.message
            );

            return;
        }


        const itemsToInsert =
            currentOrderItems.map(item => ({

                order_id:
                    order.id,

                product_id:
                    item.product_id,

                quantity:
                    item.quantity,

                unit_price:
                    item.price,

                subtotal:
                    Number(item.price) *
                    Number(item.quantity)
            }));


        const {
            error: itemsError
        } =
            await supabaseClient
                .from("order_items")
                .insert(itemsToInsert);


        if (itemsError) {

            console.error(
                "ERROR ITEMS:",
                itemsError
            );

            alert(
                "La orden se creó pero no se pudieron guardar los productos:\n" +
                itemsError.message
            );

            return;
        }


        /*
          Crear trabajos de impresión por estación.
        */

        const stations = {};


        currentOrderItems.forEach(item => {

            const station =
                item.station ||
                "COCINA";


            if (!stations[station]) {

                stations[station] = [];
            }


            stations[station].push(item);
        });


        for (
            const station of Object.keys(stations)
        ) {

            const {
                error: printError
            } =
                await supabaseClient
                    .from("print_jobs")
                    .insert({

                        order_id:
                            order.id,

                        station:
                            station,

                        status:
                            "PENDING"
                    });


            if (printError) {

                console.warn(
                    "No se pudo crear impresión:",
                    printError
                );
            }
        }


        /*
          GRUPO / CAMIÓN:
          cobro inmediato.
        */

        if (!selectedTable.id) {

            const paymentMethod =
                await askPaymentMethod();


            if (!paymentMethod) {

                alert(
                    "La comanda fue creada. Falta registrar el pago."
                );

                currentOrderItems = [];

                renderTables();

                return;
            }


            const {
                error: paymentError
            } =
                await supabaseClient
                    .from("payments")
                    .insert({

                        order_id:
                            order.id,

                        amount:
                            total,

                        payment_method:
                            paymentMethod,

                        created_by:
                            null
                    });


            if (paymentError) {

                console.error(
                    paymentError
                );

                alert(
                    "La orden se creó, pero no se pudo registrar el pago:\n" +
                    paymentError.message
                );

                return;
            }


            await supabaseClient
                .from("orders")
                .update({
                    status: "PAGADA"
                })
                .eq(
                    "id",
                    order.id
                );
        }


        alert(
            "Comanda enviada correctamente."
        );


        currentOrderItems = [];

        renderTables();


    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error al enviar la comanda."
        );
    }
}


/* =========================================================
   MÉTODO DE PAGO
========================================================= */

function askPaymentMethod() {

    return new Promise(resolve => {

        const modal =
            document.getElementById(
                "modalBackdrop"
            );

        const content =
            document.getElementById(
                "modalContent"
            );


        content.innerHTML = `

            <div class="modal-title">
                Método de pago
            </div>

            <button
                class="option-button"
                onclick="resolvePayment('EFECTIVO')">

                EFECTIVO

            </button>

            <button
                class="option-button"
                onclick="resolvePayment('TARJETA')">

                TARJETA

            </button>

            <button
                class="option-button"
                onclick="resolvePayment('TRANSFERENCIA')">

                TRANSFERENCIA

            </button>

            <button
                class="btn btn-secondary"
                style="width:100%;margin-top:5px;"
                onclick="resolvePayment(null)">

                CANCELAR

            </button>
        `;


        window.paymentResolver =
            resolve;


        modal.classList.remove(
            "hidden"
        );
    });
}


function resolvePayment(method) {

    closeModal();

    if (
        window.paymentResolver
    ) {

        window.paymentResolver(
            method
        );

        window.paymentResolver =
            null;
    }
}

   PAGAR
========================================================= */

async function payOrder(
    orderId,
    paymentMethod
) {

    const {
        data: order,
        error: orderError
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .eq(
                "id",
                orderId
            )
            .single();


    if (orderError || !order) {

        alert(
            "No se encontró la orden."
        );

        return;
    }


    const {
        error: paymentError
    } =
        await supabaseClient
            .from("payments")
            .insert({

                order_id:
                    order.id,

                amount:
                    order.total,

                payment_method:
                    paymentMethod,

                created_by:
                    null
            });


    if (paymentError) {

        alert(
            "No se pudo registrar el pago:\n" +
            paymentError.message
        );

        return;
    }


    const {
        error: updateError
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: "PAGADA"
            })
            .eq(
                "id",
                order.id
            );


    if (updateError) {

        alert(
            "El pago se registró, pero no se pudo cerrar la orden."
        );

        return;
    }


    alert(
        "Pago registrado correctamente."
    );


    openCaja();
}

                        <div class="admin-product-price">

                        </div>

                    </div>
                `;
            });
        }


        html += `
            </div>
        `;
    });


    container.innerHTML =
        html;
}


/* =========================================================
   ADMIN USUARIOS
========================================================= */

async function adminUsers() {

    document.getElementById(
        "mainContent"
    ).innerHTML = `

        <div class="screen">

            <div class="page-title">
                USUARIOS
            </div>

            <div id="usersContainer">
                Cargando...
            </div>

            <button
                class="btn btn-secondary"
                style="margin-top:20px;"
                onclick="openAdmin()">

                REGRESAR

            </button>

        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("app_users")
            .select(
                "id, full_name, role, active, created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    const container =
        document.getElementById(
            "usersContainer"
        );


    if (error) {

        container.innerHTML = `
            <div class="empty-message">

                Error:
                ${escapeHtml(error.message)}

            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty-message">
                No hay usuarios.
            </div>
        `;

        return;
    }


    container.innerHTML = `

        <div class="admin-section">

            ${data.map(user => `

                <div class="user-row">

                    <div>

                        <strong>
                            ${escapeHtml(
                                user.full_name
                            )}
                        </strong>

                        <div class="page-subtitle"
                             style="margin:4px 0 0;">

                            ${escapeHtml(user.role)}

                        </div>

                    </div>

                    <div>

                        ${
                            user.active
                                ? "ACTIVO"
                                : "INACTIVO"
                        }

                    </div>

                </div>

            `).join("")}

        </div>
    `;
}

function closeModal() {

    document
        .getElementById(
            "modalBackdrop"
        )
        .classList.add("hidden");
}


/* =========================================================
   UTILIDADES
========================================================= */

function formatMoney(value) {

    return Number(value || 0)
        .toFixed(2);
}


function formatDate(date) {

    if (!date) return "";

    try {

        return new Date(date)
            .toLocaleString(
                "es-MX",
                {
                    dateStyle: "short",
                    timeStyle: "short"
                }
            );

    } catch {

        return date;
    }
}


function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}
