<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taquería El Titi</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8ed;
            color: #3b1f12;
            min-height: 100vh;
        }

        .header {
            background: #d94f13;
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 30px;
        }

        .header span {
            font-size: 15px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .screen-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .screen-title h2 {
            font-size: 28px;
        }

        .back-button {
            border: none;
            background: #3b1f12;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ==================== MESAS ==================== */

        .tables {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .table-button {
            border: none;
            border-radius: 18px;
            padding: 30px 20px;
            background: #f5b82e;
            color: #3b1f12;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.12);
            text-align: center;
            min-height: 145px;
        }

        .table-button.ocupada {
            background: #d94f13;
            color: white;
        }

        .table-number {
            font-size: 29px;
            font-weight: bold;
        }

        .capacity {
            font-size: 17px;
            margin-top: 8px;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 18px;
            border-radius: 20px;
            background: #2f7d32;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .status.ocupada {
            background: #3b1f12;
        }

        /* ==================== PERSONAS ==================== */

        .people-screen {
            display: none;
            text-align: center;
        }

        .people-screen h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .people-info {
            font-size: 19px;
            margin-bottom: 30px;
        }

        .people-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            max-width: 650px;
            margin: auto;
        }

        .people-button {
            border: none;
            background: #f5b82e;
            color: #3b1f12;
            font-size: 32px;
            font-weight: bold;
            padding: 35px 20px;
            border-radius: 18px;
            cursor: pointer;
        }

        .cancel-button {
            margin-top: 30px;
            border: none;
            background: #3b1f12;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        /* ==================== COMANDA ==================== */

        .order-screen {
            display: none;
        }

        .order-info {
            background: white;
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .order-info h2 {
            font-size: 28px;
        }

        .order-info p {
            margin-top: 6px;
            font-size: 17px;
        }

        .order-layout {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 20px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .category-button {
            border: none;
            background: #3b1f12;
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .category-button.active {
            background: #d94f13;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .product-button {
            border: none;
            background: white;
            color: #3b1f12;
            border-radius: 15px;
            padding: 18px;
            min-height: 110px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
        }

        .product-price {
            margin-top: 10px;
            font-size: 18px;
            color: #d94f13;
            font-weight: bold;
        }

        /* ==================== RESUMEN ==================== */

        .order-summary {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
            height: fit-content;
        }

        .order-summary h3 {
            font-size: 23px;
            margin-bottom: 15px;
        }

        .empty-order {
            color: #76594a;
            text-align: center;
            padding: 25px 5px;
        }

        .order-item {
            border-bottom: 1px solid #eadfd5;
            padding: 12px 0;
        }

        .order-item-name {
            font-weight: bold;
            font-size: 16px;
        }

        .order-item-option,
        .order-item-note {
            margin-top: 4px;
            font-size: 14px;
            color: #76594a;
        }

        .order-item-note {
            font-style: italic;
        }

        .order-item-details {
            display: flex;
            justify-content: space-between;
            margin-top: 7px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .quantity-button {
            border: none;
            background: #f5b82e;
            color: #3b1f12;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #3b1f12;
            font-size: 23px;
            font-weight: bold;
        }

        .send-button {
            width: 100%;
            border: none;
            background: #2f7d32;
            color: white;
            padding: 18px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ==================== COMANDAS DE LA MESA ==================== */

        .table-orders-screen {
            display: none;
        }

        .table-total {
            background: #f5b82e;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
        }

        .command-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
        }

        .command-card h3 {
            font-size: 21px;
            margin-bottom: 12px;
        }

        .command-product {
            padding: 7px 0;
            border-bottom: 1px solid #eee;
        }

        .command-total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .new-command-button {
            width: 100%;
            border: none;
            background: #2f7d32;
            color: white;
            padding: 18px;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* ==================== MODAL ==================== */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff8ed;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 25px;
        }

        .modal-content h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .modal-price {
            color: #d94f13;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 22px;
        }

        .modal-question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .option-buttons {
            display: grid;
            gap: 10px;
        }

        .option-button {
            border: 2px solid #3b1f12;
            background: white;
            color: #3b1f12;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .option-button.selected {
            background: #f5b82e;
        }

        .note-label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .note-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbbcaf;
            border-radius: 10px;
            font-size: 16px;
            min-height: 70px;
            resize: vertical;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-cancel,
        .modal-add {
            border: none;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-cancel {
            background: #3b1f12;
        }

        .modal-add {
            background: #2f7d32;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .order-layout {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .tables,
            .products {
                grid-template-columns: 1fr;
            }

            .people-buttons {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 23px;
            }

        }

    </style>
</head>

<body>

<header class="header">
    <h1>TAQUERÍA EL TITI</h1>
    <span>Sistema de Comandas</span>
</header>


<!-- ==================== MESAS ==================== -->

<main class="container" id="tablesScreen">

    <div class="screen-title">

        <h2>MESAS</h2>

        <button class="back-button" onclick="inicio()">
            ← INICIO
        </button>

    </div>

    <div class="tables" id="tablesContainer"></div>

</main>


<!-- ==================== PERSONAS ==================== -->

<main class="container people-screen" id="peopleScreen">

    <h2 id="peopleTitle">MESA 1</h2>

    <div class="people-info">
        ¿Cuántas personas hay en la mesa?
    </div>

    <div class="people-buttons" id="peopleButtons"></div>

    <button class="cancel-button" onclick="volverMesas()">
        ← VOLVER A MESAS
    </button>

</main>


<!-- ==================== COMANDA ==================== -->

<main class="container order-screen" id="orderScreen">

    <div class="screen-title">

        <h2 id="commandTitle">COMANDA #1</h2>

        <button class="back-button" onclick="cancelarComanda()">
            ← VOLVER
        </button>

    </div>

    <div class="order-info">

        <h2 id="orderTable">MESA 1</h2>

        <p id="orderPeople">0 personas</p>

    </div>

    <div class="order-layout">

        <section>

            <div class="categories" id="categories"></div>

            <div class="products" id="products"></div>

        </section>


        <aside class="order-summary">

            <h3>COMANDA</h3>

            <div id="orderItems"></div>

            <div class="total">

                <span>TOTAL</span>

                <span id="orderTotal">$0</span>

            </div>

            <button class="send-button" onclick="enviarComanda()">
                ENVIAR COMANDA
            </button>

        </aside>

    </div>

</main>


<!-- ==================== COMANDAS DE MESA ==================== -->

<main class="container table-orders-screen" id="tableOrdersScreen">

    <div class="screen-title">

        <h2 id="tableOrdersTitle">MESA 1</h2>

        <button class="back-button" onclick="volverMesas()">
            ← MESAS
        </button>

    </div>

    <div class="table-total">

        <span>TOTAL DE LA CUENTA</span>

        <span id="tableTotal">$0</span>

    </div>

    <div id="commandsContainer"></div>

    <button class="new-command-button" onclick="nuevaComanda()">
        + NUEVA COMANDA
    </button>

</main>


<!-- ==================== MODAL ==================== -->

<div class="modal" id="productModal">

    <div class="modal-content">

        <h2 id="modalProductName">Producto</h2>

        <div class="modal-price" id="modalProductPrice">$0</div>

        <div id="modalOptionsContainer">

            <div class="modal-question">
                ¿Cómo los quieres?
            </div>

            <div class="option-buttons">

                <button class="option-button"
                    onclick="seleccionarOpcion('Revueltos')">
                    REVUELTOS
                </button>

                <button class="option-button"
                    onclick="seleccionarOpcion('Estrellados')">
                    ESTRELLADOS
                </button>

                <button class="option-button"
                    onclick="seleccionarOpcion('Fritos')">
                    FRITOS
                </button>

            </div>

        </div>

        <label class="note-label">
            Nota para cocina (opcional)
        </label>

        <textarea
            id="productNote"
            class="note-input"
            placeholder="Ejemplo: sin tortillas, poca salsa...">
        </textarea>

        <div class="modal-actions">

            <button class="modal-cancel" onclick="cerrarModal()">
                CANCELAR
            </button>

            <button class="modal-add" onclick="confirmarProducto()">
                AGREGAR
            </button>

        </div>

    </div>

</div>


<script>

    /* ==================== DATOS ==================== */

    let mesaSeleccionada = 0;
    let capacidadSeleccionada = 0;
    let personasSeleccionadas = 0;

    let pedido = [];

    let productoTemporal = null;
    let opcionTemporal = "";

    let comandaNumero = 1;


    /* Cada mesa guarda sus comandas */

    let mesas = {

        1: { personas: 0, comandas: [] },
        2: { personas: 0, comandas: [] },
        3: { personas: 0, comandas: [] },
        4: { personas: 0, comandas: [] },
        5: { personas: 0, comandas: [] },
        6: { personas: 0, comandas: [] },
        7: { personas: 0, comandas: [] },
        8: { personas: 0, comandas: [] }

    };


    /* ==================== MENÚ ==================== */

    const menu = {

        "HUEVOS": [
            ["Huevos al Gusto", 105],
            ["Huevos a la Mexicana", 105],
            ["Huevos con Jamón", 115],
            ["Huevos con Chorizo", 115],
            ["Huevos Rancheros", 115],
            ["Huevos Divorciados", 120],
            ["Huevos con Machaca", 135],
            ["Huevos con Chicharrón", 130]
        ],

        "OMELETTES": [
            ["Omelette Clásico", 110],
            ["Omelette Norteño", 135],
            ["Omelette Sano", 130],
            ["Omelette Mexicano", 125],
            ["Omelette Campestre", 130],
            ["Omelette de la Casa", 145]
        ],

        "CHILAQUILES": [
            ["Chilaquiles Rojos", 105],
            ["Chilaquiles Verdes", 105],
            ["Chilaquiles Divorciados", 115],
            ["Chilaquiles con Huevo", 120],
            ["Chilaquiles con Machaca", 145]
        ],

        "MACHACA": [
            ["Machaca con Huevo", 135],
            ["Machaca a la Mexicana", 135]
        ],

        "CHICHARRÓN": [
            ["Chicharrón en Salsa Roja", 115],
            ["Chicharrón en Salsa Verde", 115],
            ["Chicharrón con Huevo", 130]
        ],

        "DULCE": [
            ["Hot Cakes Clásicos", 90],
            ["Hot Cakes con Fruta", 110],
            ["Pan Francés", 100]
        ],

        "BEBIDAS": [
            ["Café de Olla", 25],
            ["Café Americano", 25],
            ["Jugo de Naranja", 40],
            ["Agua Fresca del Día", 30],
            ["Coca-Cola 600 ml", 30]
        ],

        "EXTRAS": [
            ["Huevo extra", 20],
            ["Chorizo", 25],
            ["Jamón", 25],
            ["Queso", 20],
            ["Machaca", 40],
            ["Chicharrón", 35],
            ["Frijoles", 20],
            ["Tortillas", 15],
            ["Aguacate", 30]
        ]

    };


    /* ==================== CREAR MESAS ==================== */

    function crearMesas() {

        const contenedor =
            document.getElementById("tablesContainer");

        contenedor.innerHTML = "";

        for (let i = 1; i <= 8; i++) {

            const capacidad = i <= 5 ? "5–6" : "2–4";

            const ocupada =
                mesas[i].comandas.length > 0;

            const boton =
                document.createElement("button");

            boton.className =
                "table-button" +
                (ocupada ? " ocupada" : "");

            boton.onclick = function() {

                seleccionarMesa(i, i <= 5 ? 6 : 4);

            };

            boton.innerHTML = `

                <div class="table-number">
                    MESA ${i}
                </div>

                <div class="capacity">
                    ${capacidad} personas
                </div>

                <div class="status ${ocupada ? "ocupada" : ""}">
                    ${ocupada ? "OCUPADA" : "LIBRE"}
                </div>

            `;

            contenedor.appendChild(boton);

        }

    }


    /* ==================== SELECCIONAR MESA ==================== */

    function seleccionarMesa(numero, capacidad) {

        mesaSeleccionada = numero;
        capacidadSeleccionada = capacidad;

        if (mesas[numero].comandas.length > 0) {

            mostrarComandasMesa();

            return;

        }

        document.getElementById("tablesScreen").style.display =
            "none";

        document.getElementById("peopleScreen").style.display =
            "block";

        document.getElementById("peopleTitle").innerText =
            "MESA " + numero;

        crearBotonesPersonas(capacidad);

    }


    /* ==================== PERSONAS ==================== */

    function crearBotonesPersonas(capacidad) {

        const contenedor =
            document.getElementById("peopleButtons");

        contenedor.innerHTML = "";

        let minimo = capacidad === 4 ? 2 : 1;

        for (
            let personas = minimo;
            personas <= capacidad;
            personas++
        ) {

            const boton =
                document.createElement("button");

            boton.className = "people-button";

            boton.innerText = personas;

            boton.onclick = function() {

                comenzarPrimeraComanda(personas);

            };

            contenedor.appendChild(boton);

        }

    }


    /* ==================== PRIMERA COMANDA ==================== */

    function comenzarPrimeraComanda(personas) {

        personasSeleccionadas = personas;

        mesas[mesaSeleccionada].personas =
            personas;

        nuevaComanda();

    }


    /* ==================== NUEVA COMANDA ==================== */

    function nuevaComanda() {

        pedido = [];

        comandaNumero =
            mesas[mesaSeleccionada].comandas.length + 1;

        document.getElementById("peopleScreen").style.display =
            "none";

        document.getElementById("tableOrdersScreen").style.display =
            "none";

        document.getElementById("orderScreen").style.display =
            "block";

        document.getElementById("commandTitle").innerText =
            "COMANDA #" + comandaNumero;

        document.getElementById("orderTable").innerText =
            "MESA " + mesaSeleccionada;

        document.getElementById("orderPeople").innerText =
            mesas[mesaSeleccionada].personas +
            (
                mesas[mesaSeleccionada].personas === 1
                    ? " persona"
                    : " personas"
            );

        crearCategorias();

        mostrarCategoria("HUEVOS");

        actualizarPedido();

    }


    /* ==================== CATEGORÍAS ==================== */

    function crearCategorias() {

        const contenedor =
            document.getElementById("categories");

        contenedor.innerHTML = "";

        Object.keys(menu).forEach(categoria => {

            const boton =
                document.createElement("button");

            boton.className =
                "category-button";

            boton.innerText =
                categoria;

            boton.onclick = function() {

                mostrarCategoria(categoria);

            };

            contenedor.appendChild(boton);

        });

    }


    /* ==================== PRODUCTOS ==================== */

    function mostrarCategoria(categoria) {

        const contenedor =
            document.getElementById("products");

        contenedor.innerHTML = "";

        document.querySelectorAll(".category-button")
            .forEach(boton => {

                boton.classList.remove("active");

                if (boton.innerText === categoria) {
                    boton.classList.add("active");
                }

            });


        menu[categoria].forEach(producto => {

            const nombre = producto[0];
            const precio = producto[1];

            const boton =
                document.createElement("button");

            boton.className =
                "product-button";

            boton.innerHTML = `

                <div class="product-name">
                    ${nombre}
                </div>

                <div class="product-price">
                    $${precio}
                </div>

            `;

            boton.onclick = function() {

                seleccionarProducto(nombre, precio);

            };

            contenedor.appendChild(boton);

        });

    }


    /* ==================== SELECCIONAR PRODUCTO ==================== */

    function seleccionarProducto(nombre, precio) {

        productoTemporal = {
            nombre: nombre,
            precio: precio
        };

        opcionTemporal = "";

        document.getElementById("modalProductName").innerText =
            nombre;

        document.getElementById("modalProductPrice").innerText =
            "$" + precio;

        document.getElementById("productNote").value = "";


        const opciones =
            document.getElementById("modalOptionsContainer");


        if (nombre === "Huevos al Gusto") {

            opciones.style.display = "block";

        } else {

            opciones.style.display = "none";

        }


        document.querySelectorAll(".option-button")
            .forEach(boton => {

                boton.classList.remove("selected");

            });


        document.getElementById("productModal").style.display =
            "flex";

    }


    /* ==================== OPCIÓN ==================== */

    function seleccionarOpcion(opcion) {

        opcionTemporal = opcion;

        document.querySelectorAll(".option-button")
            .forEach(boton => {

                boton.classList.remove("selected");

                if (boton.innerText === opcion.toUpperCase()) {

                    boton.classList.add("selected");

                }

            });

    }


    /* ==================== CONFIRMAR PRODUCTO ==================== */

    function confirmarProducto() {

        if (!productoTemporal) {
            return;
        }


        if (
            productoTemporal.nombre === "Huevos al Gusto"
            &&
            opcionTemporal === ""
        ) {

            alert(
                "Selecciona cómo quieres los huevos."
            );

            return;

        }


        const nota =
            document.getElementById("productNote")
            .value
            .trim();


        pedido.push({

            nombre: productoTemporal.nombre,

            precio: productoTemporal.precio,

            cantidad: 1,

            opcion: opcionTemporal,

            nota: nota

        });


        cerrarModal();

        actualizarPedido();

    }


    /* ==================== CERRAR MODAL ==================== */

    function cerrarModal() {

        document.getElementById("productModal").style.display =
            "none";

        productoTemporal = null;

        opcionTemporal = "";

    }


    /* ==================== ACTUALIZAR PEDIDO ==================== */

    function actualizarPedido() {

        const contenedor =
            document.getElementById("orderItems");

        contenedor.innerHTML = "";

        let total = 0;


        if (pedido.length === 0) {

            contenedor.innerHTML = `
                <div class="empty-order">
                    No hay productos agregados.
                </div>
            `;

        }


        pedido.forEach((producto, indice) => {

            const subtotal =
                producto.precio *
                producto.cantidad;

            total += subtotal;


            const item =
                document.createElement("div");

            item.className =
                "order-item";


            let opcionHTML = "";

            if (producto.opcion) {

                opcionHTML = `
                    <div class="order-item-option">
                        ${producto.opcion}
                    </div>
                `;

            }


            let notaHTML = "";

            if (producto.nota) {

                notaHTML = `
                    <div class="order-item-note">
                        Nota: ${producto.nota}
                    </div>
                `;

            }


            item.innerHTML = `

                <div class="order-item-name">
                    ${producto.nombre}
                </div>

                ${opcionHTML}

                ${notaHTML}

                <div class="order-item-details">

                    <span>
                        $${producto.precio} c/u
                    </span>

                    <strong>
                        $${subtotal}
                    </strong>

                </div>

                <div class="quantity-controls">

                    <button
                        class="quantity-button"
                        onclick="cambiarCantidad(${indice}, -1)">
                        −
                    </button>

                    <strong>
                        ${producto.cantidad}
                    </strong>

                    <button
                        class="quantity-button"
                        onclick="cambiarCantidad(${indice}, 1)">
                        +
                    </button>

                </div>

            `;

            contenedor.appendChild(item);

        });


        document.getElementById("orderTotal").innerText =
            "$" + total;

    }


    /* ==================== CANTIDAD ==================== */

    function cambiarCantidad(indice, cambio) {

        pedido[indice].cantidad += cambio;

        if (pedido[indice].cantidad <= 0) {

            pedido.splice(indice, 1);

        }

        actualizarPedido();

    }


    /* ==================== ENVIAR COMANDA ==================== */

    function enviarComanda() {

        if (pedido.length === 0) {

            alert(
                "Agrega al menos un producto."
            );

            return;

        }


        const total =
            pedido.reduce(
                (suma, producto) =>
                    suma +
                    producto.precio *
                    producto.cantidad,
                0
            );


        const nuevaComanda = {

            numero: comandaNumero,

            productos:
                JSON.parse(
                    JSON.stringify(pedido)
                ),

            total: total

        };


        mesas[mesaSeleccionada]
            .comandas
            .push(nuevaComanda);


        alert(
            "COMANDA #" +
            comandaNumero +
            " ENVIADA\n\n" +

            "Mesa: " +
            mesaSeleccionada +

            "\nTotal: $" +
            total
        );


        mostrarComandasMesa();

        crearMesas();

    }


    /* ==================== MOSTRAR COMANDAS ==================== */

    function mostrarComandasMesa() {

        document.getElementById("tablesScreen").style.display =
            "none";

        document.getElementById("peopleScreen").style.display =
            "none";

        document.getElementById("orderScreen").style.display =
            "none";

        document.getElementById("tableOrdersScreen").style.display =
            "block";


        document.getElementById("tableOrdersTitle").innerText =
            "MESA " + mesaSeleccionada;


        const contenedor =
            document.getElementById("commandsContainer");

        contenedor.innerHTML = "";


        let totalCuenta = 0;


        mesas[mesaSeleccionada]
            .comandas
            .forEach(comanda => {

                totalCuenta +=
                    comanda.total;


                const tarjeta =
                    document.createElement("div");

                tarjeta.className =
                    "command-card";


                let productosHTML = "";


                comanda.productos.forEach(producto => {

                    let detalles = "";

                    if (producto.opcion) {
                        detalles +=
                            " — " +
                            producto.opcion;
                    }

                    if (producto.nota) {
                        detalles +=
                            " — " +
                            producto.nota;
                    }


                    productosHTML += `

                        <div class="command-product">

                            ${producto.cantidad}
                            ×
                            ${producto.nombre}

                            ${detalles}

                        </div>

                    `;

                });


                tarjeta.innerHTML = `

                    <h3>
                        COMANDA #${comanda.numero}
                    </h3>

                    ${productosHTML}

                    <div class="command-total">
                        $${comanda.total}
                    </div>

                `;


                contenedor.appendChild(tarjeta);

            });


        document.getElementById("tableTotal").innerText =
            "$" + totalCuenta;

    }


    /* ==================== CANCELAR COMANDA ==================== */

    function cancelarComanda() {

        if (pedido.length > 0) {

            const salir =
                confirm(
                    "Hay productos en esta comanda.\n\n" +
                    "¿Quieres salir sin enviarla?"
                );

            if (!salir) {
                return;
            }

        }


        mostrarComandasMesa();

    }


    /* ==================== VOLVER A MESAS ==================== */

    function volverMesas() {

        document.getElementById("peopleScreen").style.display =
            "none";

        document.getElementById("orderScreen").style.display =
            "none";

        document.getElementById("tableOrdersScreen").style.display =
            "none";

        document.getElementById("tablesScreen").style.display =
            "block";

        crearMesas();

    }


    function inicio() {

        alert(
            "La pantalla de INICIO la conectaremos después."
        );

    }


    /* ==================== INICIO ==================== */

    crearMesas();

</script>

</body>
</html>
