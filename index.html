<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taquería El Titi</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8e8;
  color:#3b1f0f;
}

header{
  background:#e85d04;
  color:white;
  padding:18px 15px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}

header h1{
  margin:0;
  font-size:30px;
  font-weight:900;
}

header p{
  margin:5px 0 0;
  font-size:16px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.screen-title{
  text-align:center;
  font-size:25px;
  font-weight:900;
  margin:10px 0 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

button{
  border:none;
  border-radius:12px;
  padding:18px 12px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  min-height:60px;
}

button:active{
  transform:scale(.98);
}

.main-btn{
  background:#f9c80e;
  color:#3b1f0f;
}

.orange-btn{
  background:#e85d04;
  color:white;
}

.brown-btn{
  background:#5a2d0c;
  color:white;
}

.green-btn{
  background:#438a3d;
  color:white;
}

.red-btn{
  background:#b42318;
  color:white;
}

.white-btn{
  background:white;
  color:#3b1f0f;
  border:2px solid #e85d04;
}

.back{
  margin-top:20px;
  width:100%;
}

.table-card{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
  text-align:center;
}

.table-number{
  font-size:28px;
  font-weight:900;
}

.status{
  margin-top:7px;
  font-weight:800;
  color:#438a3d;
}

.status.occupied{
  color:#b42318;
}

.info-box{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.info-box strong{
  color:#e85d04;
}

.people-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:15px;
}

.category-btn{
  background:#5a2d0c;
  color:white;
  padding:14px 8px;
  font-size:15px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.product-btn{
  background:white;
  border:2px solid #e85d04;
  color:#3b1f0f;
  min-height:75px;
  font-size:15px;
}

.product-btn span{
  display:block;
  color:#e85d04;
  margin-top:5px;
  font-size:17px;
}

.order-box{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-top:18px;
  box-shadow:0 2px 7px rgba(0,0,0,.15);
}

.order-item{
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.order-item:last-child{
  border-bottom:none;
}

.order-name{
  font-weight:900;
}

.order-details{
  font-size:14px;
  color:#666;
  margin-top:4px;
}

.qty-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.qty-controls button{
  min-height:38px;
  width:42px;
  padding:5px;
  font-size:20px;
}

.qty{
  min-width:30px;
  text-align:center;
  font-weight:900;
}

.total{
  font-size:27px;
  font-weight:900;
  text-align:right;
  margin-top:15px;
  color:#e85d04;
}

.send-btn{
  width:100%;
  margin-top:15px;
  background:#438a3d;
  color:white;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal{
  background:#fff8e8;
  width:100%;
  max-width:500px;
  border-radius:16px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal h2{
  margin-top:0;
  text-align:center;
}

.option-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.note{
  width:100%;
  min-height:90px;
  padding:12px;
  border-radius:10px;
  border:2px solid #ddd;
  font-size:16px;
  resize:vertical;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.hidden{
  display:none !important;
}

.account-card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.account-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.account-title{
  font-size:20px;
  font-weight:900;
}

.account-total{
  color:#e85d04;
  font-size:22px;
  font-weight:900;
}

.command-card{
  background:#fff8e8;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}

.command-card strong{
  color:#e85d04;
}

.history-card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 7px rgba(0,0,0,.12);
}

.history-total{
  color:#438a3d;
  font-size:22px;
  font-weight:900;
}

.payment-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.payment-btn{
  background:#f9c80e;
  color:#3b1f0f;
  min-height:65px;
}

.cash-box{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.cash-box input{
  width:100%;
  padding:14px;
  font-size:20px;
  border:2px solid #ddd;
  border-radius:10px;
  margin-top:8px;
}

.change{
  font-size:24px;
  font-weight:900;
  color:#438a3d;
  text-align:center;
  margin-top:12px;
}

.empty{
  background:white;
  border-radius:14px;
  padding:25px;
  text-align:center;
  color:#666;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .payment-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>TAQUERÍA EL TITI</h1>
  <p>Sistema de Comandas</p>
</header>

<div id="app"></div>

<script>

let mesas = {};

for(let i=1;i<=8;i++){
  mesas[i]={
    personas:0,
    comandas:[],
    estado:"LIBRE"
  };
}

let historial=[];
let pantalla="inicio";
let mesaSeleccionada=null;
let personasSeleccionadas=0;
let categoriaActual="HUEVOS";
let pedidoActual=[];
let comandaNumero=1;
let tipoOperacion="";
let cuentaParaCobrar=null;

const menu={

  "HUEVOS":[
    {nombre:"Huevos al Gusto",precio:105,opciones:["REVUELTOS","ESTRELLADOS","FRITOS"]},
    {nombre:"Huevos a la Mexicana",precio:105},
    {nombre:"Huevos con Jamón",precio:115},
    {nombre:"Huevos con Chorizo",precio:115},
    {nombre:"Huevos Rancheros",precio:115},
    {nombre:"Huevos Divorciados",precio:120},
    {nombre:"Huevos con Machaca",precio:135},
    {nombre:"Huevos con Chicharrón",precio:130}
  ],

  "OMELETTES":[
    {nombre:"Omelette Clásico",precio:110},
    {nombre:"Omelette Norteño",precio:135},
    {nombre:"Omelette Sano",precio:130},
    {nombre:"Omelette Mexicano",precio:125},
    {nombre:"Omelette Campestre",precio:130},
    {nombre:"Omelette de la Casa",precio:145}
  ],

  "CHILAQUILES":[
    {nombre:"Chilaquiles Rojos",precio:105},
    {nombre:"Chilaquiles Verdes",precio:105},
    {nombre:"Chilaquiles Divorciados",precio:115},
    {nombre:"Chilaquiles con Huevo",precio:120},
    {nombre:"Chilaquiles con Machaca",precio:145}
  ],

  "MACHACA":[
    {nombre:"Machaca con Huevo",precio:135},
    {nombre:"Machaca a la Mexicana",precio:135}
  ],

  "CHICHARRÓN":[
    {nombre:"Chicharrón en Salsa Roja",precio:115},
    {nombre:"Chicharrón en Salsa Verde",precio:115},
    {nombre:"Chicharrón con Huevo",precio:130}
  ],

  "DULCE":[
    {nombre:"Hot Cakes Clásicos",precio:90},
    {nombre:"Hot Cakes con Fruta",precio:110},
    {nombre:"Pan Francés",precio:100}
  ],

  "BEBIDAS":[
    {nombre:"Café de Olla",precio:25},
    {nombre:"Café Americano",precio:25},
    {nombre:"Jugo de Naranja",precio:40},
    {nombre:"Agua Fresca del Día",precio:30},
    {nombre:"Coca-Cola 600 ml",precio:30}
  ],

  "EXTRAS":[
    {nombre:"Huevo extra",precio:20},
    {nombre:"Chorizo",precio:25},
    {nombre:"Jamón",precio:25},
    {nombre:"Queso",precio:20},
    {nombre:"Machaca",precio:40},
    {nombre:"Chicharrón",precio:35},
    {nombre:"Frijoles",precio:20},
    {nombre:"Tortillas",precio:15},
    {nombre:"Aguacate",precio:30}
  ]

};

function dinero(valor){
  return "$"+Number(valor).toFixed(2);
}

function render(){
  const app=document.getElementById("app");

  if(pantalla==="inicio") renderInicio(app);
  if(pantalla==="mesas") renderMesas(app);
  if(pantalla==="personas") renderPersonas(app);
  if(pantalla==="comanda") renderComanda(app);
  if(pantalla==="comandasMesa") renderComandasMesa(app);
  if(pantalla==="grupo") renderGrupo(app);
  if(pantalla==="caja") renderCaja(app);
  if(pantalla==="pago") renderPago(app);
  if(pantalla==="historial") renderHistorial(app);
}

function renderInicio(app){

  app.innerHTML=`
    <div class="container">

      <div class="screen-title">MENÚ PRINCIPAL</div>

      <div class="grid">

        <button class="main-btn" onclick="irMesas()">
          MESAS
        </button>

        <button class="main-btn" onclick="irGrupo()">
          GRUPO / CAMIÓN
        </button>

        <button class="orange-btn" onclick="irCaja()">
          CAJA
        </button>

        <button class="brown-btn" onclick="irHistorial()">
          HISTORIAL
        </button>

      </div>

      <div class="info-box" style="margin-top:20px;text-align:center;">
        <strong>POR LA MAÑANA: SOLO DESAYUNOS</strong><br>
        TACOS A PARTIR DE LA 1:00 PM<br>
        TAMBIÉN CONTAMOS CON TIENDITA
      </div>

    </div>
  `;
}

function irMesas(){
  pantalla="mesas";
  render();
}

function renderMesas(app){

  let html=`
    <div class="container">
      <div class="screen-title">MESAS</div>
      <div class="grid">
  `;

  for(let i=1;i<=8;i++){

    let capacidad=i<=5 ? "5–6 personas" : "2–4 personas";
    let ocupada=mesas[i].comandas.length>0;

    html+=`
      <button class="table-card" onclick="seleccionarMesa(${i})">
        <div class="table-number">MESA ${i}</div>
        <div>${capacidad}</div>
        <div class="status ${ocupada?"occupied":""}">
          ${ocupada?"OCUPADA":"LIBRE"}
        </div>
      </button>
    `;
  }

  html+=`
      </div>

      <button class="brown-btn back" onclick="irInicio()">
        VOLVER
      </button>
    </div>
  `;

  app.innerHTML=html;
}

function seleccionarMesa(numero){

  mesaSeleccionada=numero;

  if(mesas[numero].comandas.length>0){
    pantalla="comandasMesa";
    render();
    return;
  }

  pantalla="personas";
  render();
}

function renderPersonas(app){

  let max=mesaSeleccionada<=5 ? 6 : 4;
  let min=mesaSeleccionada<=5 ? 1 : 2;

  let html=`
    <div class="container">

      <div class="screen-title">
        MESA ${mesaSeleccionada}
      </div>

      <div class="info-box" style="text-align:center;">
        <strong>¿CUÁNTAS PERSONAS HAY EN LA MESA?</strong>
      </div>

      <div class="people-grid">
  `;

  for(let i=min;i<=max;i++){
    html+=`
      <button class="main-btn" onclick="seleccionarPersonas(${i})">
        ${i}
      </button>
    `;
  }

  html+=`
      </div>

      <button class="brown-btn back" onclick="irMesas()">
        VOLVER
      </button>

    </div>
  `;

  app.innerHTML=html;
}

function seleccionarPersonas(numero){

  personasSeleccionadas=numero;

  mesas[mesaSeleccionada].personas=numero;

  nuevaComanda();
}

function nuevaComanda(){

  pedidoActual=[];
  categoriaActual="HUEVOS";

  comandaNumero=mesas[mesaSeleccionada].comandas.length+1;

  pantalla="comanda";
  render();
}

function renderComanda(app){

  let html=`
    <div class="container">

      <div class="screen-title">
        COMANDA #${comandaNumero}
      </div>

      <div class="info-box">
        <strong>MESA:</strong> ${mesaSeleccionada}<br>
        <strong>PERSONAS:</strong> ${mesas[mesaSeleccionada].personas}
      </div>

      <div class="category-grid">
  `;

  Object.keys(menu).forEach(cat=>{
    html+=`
      <button class="category-btn" onclick="seleccionarCategoria('${cat}')">
        ${cat}
      </button>
    `;
  });

  html+=`
      </div>

      <div class="product-grid">
  `;

  menu[categoriaActual].forEach((producto,index)=>{

    html+=`
      <button class="product-btn"
        onclick="seleccionarProducto('${categoriaActual}',${index})">

        ${producto.nombre}
        <span>${dinero(producto.precio)}</span>

      </button>
    `;
  });

  html+=`
      </div>

      <div class="order-box">

        <h3>COMANDA ACTUAL</h3>
  `;

  if(pedidoActual.length===0){

    html+=`
      <div class="empty">
        No hay productos agregados.
      </div>
    `;

  }else{

    pedidoActual.forEach((item,index)=>{

      html+=`
        <div class="order-item">

          <div class="order-name">
            ${item.nombre}
          </div>

          ${item.opcion ? `
            <div class="order-details">
              Opción: ${item.opcion}
            </div>
          `:""}

          ${item.nota ? `
            <div class="order-details">
              Nota: ${item.nota}
            </div>
          `:""}

          <div class="order-details">
            ${dinero(item.precio)} c/u
          </div>

          <div class="qty-controls">

            <button class="brown-btn"
              onclick="cambiarCantidad(${index},-1)">
              −
            </button>

            <div class="qty">
              ${item.cantidad}
            </div>

            <button class="orange-btn"
              onclick="cambiarCantidad(${index},1)">
              +
            </button>

          </div>

        </div>
      `;
    });
  }

  let total=calcularPedido();

  html+=`
        <div class="total">
          TOTAL: ${dinero(total)}
        </div>

        <button class="send-btn"
          onclick="enviarComanda()">
          ENVIAR COMANDA
        </button>

      </div>

      <button class="brown-btn back"
        onclick="cancelarComanda()">
        VOLVER
      </button>

    </div>
  `;

  app.innerHTML=html;
}

function seleccionarCategoria(cat){
  categoriaActual=cat;
  render();
}

function seleccionarProducto(categoria,index){

  let producto=menu[categoria][index];

  abrirModalProducto(producto);
}

function abrirModalProducto(producto){

  let opciones="";

  if(producto.opciones){

    opciones=`
      <div class="option-grid">

        ${producto.opciones.map(op=>`
          <button class="main-btn"
            onclick="confirmarProducto('${producto.nombre}',${producto.precio},'${op}')">
            ${op}
          </button>
        `).join("")}

      </div>
    `;

  }else{

    opciones=`
      <button class="orange-btn"
        onclick="confirmarProducto('${producto.nombre}',${producto.precio},'')">
        AGREGAR PRODUCTO
      </button>
    `;
  }

  document.body.insertAdjacentHTML("beforeend",`

    <div class="modal-bg" id="productoModal">

      <div class="modal">

        <h2>${producto.nombre}</h2>

        <div style="text-align:center;margin-bottom:15px;">
          <strong>${dinero(producto.precio)}</strong>
        </div>

        ${opciones}

        <div style="margin-top:18px;">
          <strong>NOTA PARA COCINA (OPCIONAL)</strong>

          <textarea
            id="notaProducto"
            class="note"
            placeholder="Ejemplo: sin cebolla, poca salsa, etc."></textarea>
        </div>

        <button class="brown-btn back"
          onclick="cerrarModal()">
          CANCELAR
        </button>

      </div>

    </div>
  `);
}

function cerrarModal(){
  let modal=document.getElementById("productoModal");
  if(modal) modal.remove();
}

function confirmarProducto(nombre,precio,opcion){

  let nota=document.getElementById("notaProducto").value.trim();

  let existente=pedidoActual.find(item=>
    item.nombre===nombre &&
    item.opcion===opcion &&
    item.nota===nota
  );

  if(existente){
    existente.cantidad++;
  }else{
    pedidoActual.push({
      nombre:nombre,
      precio:precio,
      opcion:opcion,
      nota:nota,
      cantidad:1
    });
  }

  cerrarModal();
  render();
}

function cambiarCantidad(index,cambio){

  pedidoActual[index].cantidad+=cambio;

  if(pedidoActual[index].cantidad<=0){
    pedidoActual.splice(index,1);
  }

  render();
}

function calcularPedido(){

  return pedidoActual.reduce(
    (total,item)=>total+(item.precio*item.cantidad),0
  );
}

function enviarComanda(){

  if(pedidoActual.length===0){
    alert("Agrega al menos un producto antes de enviar la comanda.");
    return;
  }

  let total=calcularPedido();

  mesas[mesaSeleccionada].comandas.push({

    numero:comandaNumero,

    productos:JSON.parse(
      JSON.stringify(pedidoActual)
    ),

    total:total,

    fecha:new Date().toLocaleString()

  });

  mesas[mesaSeleccionada].estado="OCUPADA";

  alert(
    "COMANDA #"+comandaNumero+
    " enviada correctamente."
  );

  pedidoActual=[];

  pantalla="comandasMesa";

  render();
}

function cancelarComanda(){

  if(pedidoActual.length>0){

    let confirmar=confirm(
      "¿Seguro que quieres cancelar esta comanda?"
    );

    if(!confirmar) return;
  }

  pedidoActual=[];

  if(mesas[mesaSeleccionada].comandas.length>0){
    pantalla="comandasMesa";
  }else{
    pantalla="mesas";
  }

  render();
}

function renderComandasMesa(app){

  let mesa=mesas[mesaSeleccionada];

  let total=mesa.comandas.reduce(
    (s,c)=>s+c.total,0
  );

  let html=`
    <div class="container">

      <div class="screen-title">
        MESA ${mesaSeleccionada}
      </div>

      <div class="info-box">
        <strong>PERSONAS:</strong> ${mesa.personas}<br>
        <strong>COMANDAS:</strong> ${mesa.comandas.length}
      </div>
  `;

  mesa.comandas.forEach(comanda=>{

    html+=`
      <div class="account-card">

        <div class="account-header">
          <div class="account-title">
            COMANDA #${comanda.numero}
          </div>

          <div class="account-total">
            ${dinero(comanda.total)}
          </div>
        </div>
    `;

    comanda.productos.forEach(item=>{

      html+=`
        <div class="command-card">

          <strong>${item.cantidad} x ${item.nombre}</strong>

          ${item.opcion ? `
            <br>Opción: ${item.opcion}
          `:""}

          ${item.nota ? `
            <br>Nota: ${item.nota}
          `:""}

        </div>
      `;
    });

    html+=`
      </div>
    `;
  });

  html+=`

      <div class="order-box">

        <div class="total">
          TOTAL DE LA CUENTA: ${dinero(total)}
        </div>

        <button class="green-btn"
          style="width:100%;margin-top:15px;"
          onclick="abrirPagoMesa()">
          COBRAR MESA
        </button>

        <button class="orange-btn"
          style="width:100%;margin-top:10px;"
          onclick="nuevaComanda()">
          NUEVA COMANDA
        </button>

      </div>

      <button class="brown-btn back"
        onclick="irMesas()">
        VOLVER A MESAS
      </button>

    </div>
  `;

  app.innerHTML=html;
}

function abrirPagoMesa(){

  let total=mesas[mesaSeleccionada].comandas.reduce(
    (s,c)=>s+c.total,0
  );

  cuentaParaCobrar={
    tipo:"MESA",
    mesa:mesaSeleccionada,
    personas:mesas[mesaSeleccionada].personas,
    total:total
  };

  pantalla="pago";

  render();
}

function irGrupo(){

  pedidoActual=[];
  tipoOperacion="GRUPO";

  pantalla="grupo";

  render();
}

function renderGrupo(app){

  let html=`
    <div class="container">

      <div class="screen-title">
        GRUPO / CAMIÓN
      </div>

      <div class="info-box">
        <strong>ESTA ORDEN SE COBRA INMEDIATAMENTE.</strong><br>
        Si posteriormente consumen algo más, se crea una nueva orden.
      </div>

      <div class="category-grid">
  `;

  Object.keys(menu).forEach(cat=>{
    html+=`
      <button class="category-btn"
        onclick="seleccionarCategoriaGrupo('${cat}')">
        ${cat}
      </button>
    `;
  });

  html+=`
      </div>

      <div class="product-grid">
  `;

  let categoriaGrupo=window.categoriaGrupo||"HUEVOS";

  menu[categoriaGrupo].forEach((producto,index)=>{

    html+=`
      <button class="product-btn"
        onclick="seleccionarProductoGrupo('${categoriaGrupo}',${index})">

        ${producto.nombre}

        <span>${dinero(producto.precio)}</span>

      </button>
    `;
  });

  html+=`
      </div>

      <div class="order-box">

        <h3>ORDEN ACTUAL</h3>
  `;

  if(pedidoActual.length===0){

    html+=`
      <div class="empty">
        No hay productos agregados.
      </div>
    `;

  }else{

    pedidoActual.forEach((item,index)=>{

      html+=`
        <div class="order-item">

          <div class="order-name">
            ${item.nombre}
          </div>

          ${item.opcion ? `
            <div class="order-details">
              Opción: ${item.opcion}
            </div>
          `:""}

          ${item.nota ? `
            <div class="order-details">
              Nota: ${item.nota}
            </div>
          `:""}

          <div class="qty-controls">

            <button class="brown-btn"
              onclick="cambiarCantidadGrupo(${index},-1)">
              −
            </button>

            <div class="qty">
              ${item.cantidad}
            </div>

            <button class="orange-btn"
              onclick="cambiarCantidadGrupo(${index},1)">
              +
            </button>

          </div>

        </div>
      `;
    });
  }

  html+=`

        <div class="total">
          TOTAL: ${dinero(calcularPedido())}
        </div>

        <button class="green-btn"
          style="width:100%;margin-top:15px;"
          onclick="cobrarGrupo()">
          COBRAR GRUPO
        </button>

      </div>

      <button class="brown-btn back"
        onclick="irInicio()">
        VOLVER
      </button>

    </div>
  `;

  app.innerHTML=html;
}

function seleccionarCategoriaGrupo(cat){

  window.categoriaGrupo=cat;

  render();
}

function seleccionarProductoGrupo(cat,index){

  let producto=menu[cat][index];

  let opciones="";

  if(producto.opciones){

    opciones=`
      <div class="option-grid">

        ${producto.opciones.map(op=>`
          <button class="main-btn"
            onclick="confirmarProductoGrupo('${producto.nombre}',${producto.precio},'${op}')">
            ${op}
          </button>
        `).join("")}

      </div>
    `;

  }else{

    opciones=`
      <button class="orange-btn"
        onclick="confirmarProductoGrupo('${producto.nombre}',${producto.precio},'')">
        AGREGAR PRODUCTO
      </button>
    `;
  }

  document.body.insertAdjacentHTML("beforeend",`

    <div class="modal-bg" id="grupoModal">

      <div class="modal">

        <h2>${producto.nombre}</h2>

        ${opciones}

        <div style="margin-top:18px;">
          <strong>NOTA PARA COCINA</strong>

          <textarea
            id="notaGrupo"
            class="note"
            placeholder="Nota opcional"></textarea>
        </div>

        <button class="brown-btn back"
          onclick="document.getElementById('grupoModal').remove()">
          CANCELAR
        </button>

      </div>

    </div>
  `);
}

function confirmarProductoGrupo(nombre,precio,opcion){

  let nota=document.getElementById("notaGrupo").value.trim();

  let existente=pedidoActual.find(item=>
    item.nombre===nombre &&
    item.opcion===opcion &&
    item.nota===nota
  );

  if(existente){
    existente.cantidad++;
  }else{
    pedidoActual.push({
      nombre:nombre,
      precio:precio,
      opcion:opcion,
      nota:nota,
      cantidad:1
    });
  }

  document.getElementById("grupoModal").remove();

  render();
}

function cambiarCantidadGrupo(index,cambio){

  pedidoActual[index].cantidad+=cambio;

  if(pedidoActual[index].cantidad<=0){
    pedidoActual.splice(index,1);
  }

  render();
}

function cobrarGrupo(){

  if(pedidoActual.length===0){
    alert("Agrega al menos un producto.");
    return;
  }

  cuentaParaCobrar={
    tipo:"GRUPO",
    total:calcularPedido(),
    productos:JSON.parse(
      JSON.stringify(pedidoActual)
    )
  };

  pantalla="pago";

  render();
}

function renderCaja(app){

  let mesasPendientes=[];

  for(let i=1;i<=8;i++){

    if(mesas[i].comandas.length>0){

      let total=mesas[i].comandas.reduce(
        (s,c)=>s+c.total,0
      );

      mesasPendientes.push({
        mesa:i,
        personas:mesas[i].personas,
        comandas:mesas[i].comandas.length,
        total:total
      });
    }
  }

  let html=`
    <div class="container">

      <div class="screen-title">
        CAJA
      </div>
  `;

  if(mesasPendientes.length===0){

    html+=`
      <div class="empty">
        No hay mesas pendientes de cobro.
      </div>
    `;

  }else{

    mesasPendientes.forEach(cuenta=>{

      html+=`
        <div class="account-card">

          <div class="account-header">

            <div>
              <div class="account-title">
                MESA ${cuenta.mesa}
              </div>

              <div>
                ${cuenta.personas} personas ·
                ${cuenta.comandas} comanda(s)
              </div>
            </div>

            <div class="account-total">
              ${dinero(cuenta.total)}
            </div>

          </div>

          <button class="green-btn"
            style="width:100%;margin-top:12px;"
            onclick="prepararPagoMesa(${cuenta.mesa})">
            COBRAR
          </button>

        </div>
      `;
    });
  }

  html+=`

      <button class="brown-btn back"
        onclick="irInicio()">
        VOLVER
      </button>

    </div>
  `;

  app.innerHTML=html;
}

function prepararPagoMesa(numero){

  let total=mesas[numero].comandas.reduce(
    (s,c)=>s+c.total,0
  );

  cuentaParaCobrar={
    tipo:"MESA",
    mesa:numero,
    personas:mesas[numero].personas,
    total:total
  };

  pantalla="pago";

  render();
}

function renderPago(app){

  let cuenta=cuentaParaCobrar;

  app.innerHTML=`
    <div class="container">

      <div class="screen-title">
        COBRO
      </div>

      <div class="info-box">

        <div style="font-size:22px;font-weight:900;">
          ${cuenta.tipo==="MESA"
            ? "MESA "+cuenta.mesa
            : "GRUPO / CAMIÓN"}
        </div>

        <div style="margin-top:8px;">
          TOTAL A COBRAR:
        </div>

        <div class="total">
          ${dinero(cuenta.total)}
        </div>

      </div>

      <div class="info-box">

        <strong>MÉTODO DE PAGO</strong>

        <div class="payment-grid" style="margin-top:12px;">

          <button class="payment-btn"
            onclick="seleccionarPago('EFECTIVO')">
            EFECTIVO
          </button>

          <button class="payment-btn"
            onclick="seleccionarPago('TARJETA')">
            TARJETA
          </button>

          <button class="payment-btn"
            onclick="seleccionarPago('TRANSFERENCIA')">
            TRANSFERENCIA
          </button>

        </div>

      </div>

      <div id="pagoDetalle"></div>

      <button class="brown-btn back"
        onclick="cancelarPago()">
        CANCELAR
      </button>

    </div>
  `;
}

function seleccionarPago(metodo){

  let detalle=document.getElementById("pagoDetalle");

  if(metodo==="EFECTIVO"){

    detalle.innerHTML=`

      <div class="cash-box">

        <strong>EFECTIVO RECIBIDO</strong>

        <input
          type="number"
          id="efectivoRecibido"
          placeholder="0.00"
          step="0.01"
          oninput="calcularCambio()">

        <div id="cambio" class="change"></div>

        <button class="green-btn"
          style="width:100%;margin-top:15px;"
          onclick="finalizarPago('EFECTIVO')">
          FINALIZAR COBRO
        </button>

      </div>
    `;

  }else{

    detalle.innerHTML=`

      <div class="info-box">

        <div style="text-align:center;">
          Pago seleccionado:
          <strong>${metodo}</strong>
        </div>

        <button class="green-btn"
          style="width:100%;margin-top:15px;"
          onclick="finalizarPago('${metodo}')">
          FINALIZAR COBRO
        </button>

      </div>
    `;
  }
}

function calcularCambio(){

  let recibido=Number(
    document.getElementById("efectivoRecibido").value
  );

  let total=cuentaParaCobrar.total;

  let cambio=recibido-total;

  let div=document.getElementById("cambio");

  if(recibido<=0){

    div.innerHTML="";

  }else if(cambio<0){

    div.innerHTML=
      "FALTAN "+dinero(Math.abs(cambio));

  }else{

    div.innerHTML=
      "CAMBIO: "+dinero(cambio);
  }
}

function finalizarPago(metodo){

  if(metodo==="EFECTIVO"){

    let recibido=Number(
      document.getElementById("efectivoRecibido").value
    );

    if(recibido<cuentaParaCobrar.total){

      alert("El efectivo recibido no es suficiente.");
      return;
    }
  }

  let fecha=new Date();

  let registro={
    fecha:fecha.toLocaleString(),
    tipo:cuentaParaCobrar.tipo,
    total:cuentaParaCobrar.total,
    metodo:metodo
  };

  if(cuentaParaCobrar.tipo==="MESA"){

    registro.mesa=cuentaParaCobrar.mesa;
    registro.personas=cuentaParaCobrar.personas;

    registro.comandas=
      JSON.parse(
        JSON.stringify(
          mesas[cuentaParaCobrar.mesa].comandas
        )
      );

    mesas[cuentaParaCobrar.mesa]={
      personas:0,
      comandas:[],
      estado:"LIBRE"
    };

  }else{

    registro.productos=
      JSON.parse(
        JSON.stringify(
          cuentaParaCobrar.productos
        )
      );

    pedidoActual=[];
  }

  historial.unshift(registro);

  cuentaParaCobrar=null;

  alert("COBRO REALIZADO CORRECTAMENTE.");

  pantalla="caja";

  render();
}

function cancelarPago(){

  if(cuentaParaCobrar.tipo==="MESA"){

    pantalla="caja";

  }else{

    pantalla="grupo";
  }

  render();
}

function irHistorial(){

  pantalla="historial";

  render();
}

function renderHistorial(app){

  let html=`
    <div class="container">

      <div class="screen-title">
        HISTORIAL
      </div>
  `;

  if(historial.length===0){

    html+=`
      <div class="empty">
        Todavía no hay ventas registradas.
      </div>
    `;

  }else{

    historial.forEach((venta,index)=>{

      html+=`
        <div class="history-card">

          <div style="font-weight:900;font-size:19px;">
            ${venta.tipo==="MESA"
              ? "MESA "+venta.mesa
              : "GRUPO / CAMIÓN"}
          </div>

          <div style="margin-top:5px;">
            ${venta.fecha}
          </div>

          <div style="margin-top:5px;">
            Pago: <strong>${venta.metodo}</strong>
          </div>

          <div class="history-total"
            style="margin-top:8px;">
            ${dinero(venta.total)}
          </div>

        </div>
      `;
    });
  }

  html+=`

      <button class="brown-btn back"
        onclick="irInicio()">
        VOLVER
      </button>

    </div>
  `;

  app.innerHTML=html;
}

function irInicio(){

  pantalla="inicio";
  pedidoActual=[];
  cuentaParaCobrar=null;

  render();
}

render();

</script>

</body>
</html>
